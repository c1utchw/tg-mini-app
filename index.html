<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Desktop Pet</title>
  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <div id="pet">
      <!-- Лицо загружается динамически через skin-manager.js -->
      <div id="pet-face"></div>
    </div>
  </div>

  <!--
    Порядок загрузки скриптов:
    1. face-physics.js  — физика кристалликов
    2. face-emotions.js — эмоции
    3. face-bolts.js    — молнии
    4. face-shatter.js  — разлёт / сборка
    5. skin-manager.js  — загрузка SVG скинов, инициализирует физику
    6. renderer.js      — главный цикл
    7. debug-skin-switcher.js — ВРЕМЕННО (убрать вместе с файлом)
  -->
  <script src="face-physics.js"></script>
  <script src="face-emotions.js"></script>
  <script src="face-bolts.js"></script>
  <script src="face-shatter.js"></script>
  <script src="skin-manager.js"></script>
  <script src="renderer.js"></script>
  <script src="debug-skin-switcher.js"></script>
</body>
</html>
